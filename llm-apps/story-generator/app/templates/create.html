```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Story — StoryForge</title>

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0e17;
            color: #e8e8f0;
            min-height: 100vh;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
        }

        /* Nav */
        .nav-bar {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 50;
            background: rgba(15, 14, 23, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .nav-inner {
            max-width: 1152px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            font-family: 'Playfair Display', serif;
            color: #a78bfa;
            font-size: 1.25rem;
            font-weight: 700;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-link {
            color: #9ca3af;
            font-size: 0.875rem;
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: #fff;
        }

        .nav-btn {
            background: #7c3aed;
            color: #fff;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: background 0.2s;
        }

        .nav-btn:hover {
            background: #6d28d9;
        }

        /* Layout */
        .page-wrap {
            max-width: 768px;
            margin: 0 auto;
            padding: 7rem 1.5rem 6rem;
        }

        .back-link {
            color: #6b7280;
            font-size: 0.875rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #d1d5db;
        }

        /* Header */
        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: #f1f0f8;
            line-height: 1.3;
            margin-bottom: 0.75rem;
        }

        .page-description {
            color: #9ca3af;
            font-size: 1rem;
            line-height: 1.6;
        }

        .page-header {
            margin-bottom: 2.5rem;
        }

        /* Form Card */
        .form-card {
            background: #1a1826;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 1rem;
            padding: 2rem;
        }

        /* Form */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #d1d5db;
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            background: #0f0e17;
            border: 1px solid rgba(255,255,255,0.1);
            color: #e8e8f0;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .form-input::placeholder {
            color: #4b5563;
        }

        .form-input:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
            background: #12101c;
        }

        textarea.form-input {
            resize: vertical;
            min-height: 100px;
            line-height: 1.6;
        }

        select.form-input {
            appearance: auto;
            color-scheme: dark;
        }

        select.form-input option {
            background: #1a1826;
            color: #e8e8f0;
        }

        input[type="number"].form-input {
            appearance: textfield;
        }

        /* Form Grid */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-card {
                padding: 1.5rem;
            }

            .page-title {
                font-size: 2rem;
            }
        }

        /* Submit */
        .submit-btn {
            width: 100%;
            margin-top: 0.5rem;
            background: #7c3aed;
            color: #fff;
            font-weight: 600;
            padding: 1rem;
            border-radius: 0.75rem;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background 0.2s, transform 0.2s;
            font-size: 1rem;
        }

        .submit-btn:hover {
            background: #6d28d9;
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .form-note {
            color: #4b5563;
            font-size: 0.875rem;
            text-align: center;
            margin-top: 0.75rem;
        }

        /* Spinner */
        .spinner {
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Footer */
        .footer {
            border-top: 1px solid rgba(255,255,255,0.07);
            padding: 2rem 0;
        }

        .footer-inner {
            max-width: 1152px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .footer-logo {
            font-family: 'Playfair Display', serif;
            color: #a78bfa;
            font-weight: 700;
        }

        .footer-copy {
            color: #4b5563;
            font-size: 0.875rem;
        }

        .footer-links {
            display: flex;
            gap: 1.5rem;
        }

        .footer-links a {
            color: #6b7280;
            font-size: 0.875rem;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: #d1d5db;
        }
    </style>
</head>

<body>

    <!-- Nav -->
    <nav class="nav-bar">
        <div class="nav-inner">
            <a href="/" class="nav-logo">StoryForge</a>

            <div class="nav-links">
                <a href="/stories" class="nav-link">Browse Stories</a>

                <a href="/create" class="nav-btn">
                    Create Story
                </a>
            </div>
        </div>
    </nav>

    <!-- Main -->
    <div class="page-wrap">

        <a href="/" class="back-link">
            ← Back to Home
        </a>

        <!-- Header -->
        <div class="page-header">
            <h1 class="page-title">
                Create a Story
            </h1>

            <p class="page-description">
                Fill in the details below and we'll generate a full story for you.
            </p>
        </div>

        <!-- Form -->
        <div class="form-card">

            <form method="POST" action="/create" id="create-form">

                <!-- Story Idea -->
                <div class="form-group">
                    <label class="form-label" for="idea">
                        Story Idea
                    </label>

                    <textarea
                        class="form-input"
                        id="idea"
                        name="idea"
                        rows="3"
                        placeholder="e.g. A detective who can hear the last thoughts of murder victims..."
                        required
                    ></textarea>
                </div>

                <!-- Genre + Structure -->
                <div class="form-grid">

                    <div class="form-group">
                        <label class="form-label" for="genre">
                            Genre
                        </label>

                        <select
                            class="form-input"
                            id="genre"
                            name="genre"
                            required
                        >
                            {% for genre_choice in genre_choices %}
                                <option value="{{ genre_choice.value }}">
                                    {{ genre_choice.value }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="structure">
                            Structure
                        </label>

                        <select
                            class="form-input"
                            id="structure"
                            name="structure"
                            required
                        >
                            {% for structure_choice in structure_choices %}
                                <option value="{{ structure_choice.value }}">
                                    {{ structure_choice.value }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                </div>

                <!-- Unique Insight -->
                <div class="form-group">
                    <label class="form-label" for="unique_insight">
                        Unique Insight
                    </label>

                    <input
                        class="form-input"
                        type="text"
                        id="unique_insight"
                        name="unique_insight"
                        placeholder="e.g. The real monster is grief, not the creature"
                        required
                    >
                </div>

                <!-- Characters + POV -->
                <div class="form-grid">

                    <div class="form-group">
                        <label class="form-label" for="number_of_characters">
                            Number of Characters
                        </label>

                        <input
                            class="form-input"
                            type="number"
                            id="number_of_characters"
                            name="number_of_characters"
                            min="1"
                            max="20"
                            placeholder="3"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="point_of_view">
                            Point of View
                        </label>

                        <select
                            class="form-input"
                            id="point_of_view"
                            name="point_of_view"
                            required
                        >
                            {% for pov_choice in point_of_view_choices %}
                                <option value="{{ pov_choice.value }}">
                                    {{ pov_choice.value }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                </div>

                <!-- Submit -->
                <button
                    type="submit"
                    id="submit-btn"
                    class="submit-btn"
                >
                    <span id="btn-text">
                        ✨ Generate My Story
                    </span>

                    <span
                        id="btn-spinner"
                        class="spinner"
                    ></span>
                </button>

                <p class="form-note">
                    This may take a few seconds
                </p>

            </form>

        </div>

    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-inner">

            <span class="footer-logo">
                StoryForge
            </span>

            <p class="footer-copy">
                Built with FastAPI &amp; Amazon Bedrock
            </p>

            <div class="footer-links">
                <a href="/create">Create</a>
                <a href="/stories">Stories</a>
            </div>

        </div>
    </footer>

    <script>
        const createForm = document.getElementById('create-form');

        if (createForm) {
            createForm.addEventListener('submit', () => {
                document.getElementById('btn-text').textContent =
                    'Generating your story...';

                document.getElementById('btn-spinner').style.display = 'block';

                document.getElementById('submit-btn').disabled = true;
            });
        }
    </script>

</body>
</html>
```
